          example: pending
        deadline:
          type: string
          format: date-time
          example: "2026-09-12T23:59:00Z"

    ActivityLog:
      type: object
      required:
        - member_id
        - activity_date
        - minutes_studied
      properties:
        member_id:
          type: string
          example: anna
        activity_date:
          type: string
          format: date-time
          example: "2026-09-07T00:00:00Z"
        minutes_studied:
          type: integer
          example: 30
