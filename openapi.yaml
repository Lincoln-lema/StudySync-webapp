openapi: 3.0.0
info:
  title: StudySync API
  version: 1.2.0
  description: A collaborative study management tool API for tracking tasks, deadlines, activity, and study materials
  contact:
    name: StudySync Team
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://api.studysync.example.com
    description: Production server

security:
  - ApiKeyAuth: []

tags:
  - name: Members
    description: Team member information and reliability scores
  - name: Tasks
    description: Task management and status tracking
  - name: Deadlines
    description: Deadline and calendar event management
  - name: Activity
    description: User activity history and study logs
  - name: Study Materials
    description: Flashcard decks and study materials
  - name: Partner Integration
    description: Server-side proxy to the upstream partner (SettleIn)
  - name: Study Bookings
    description: Book study sessions at partner properties

paths:
  /api/members:
    get:
      tags:
        - Members
      summary: Get all team members with group information
      description: Retrieves a list of all team members including their reliability scores and group assignments
      operationId: getMembers
      responses:
        '200':
          description: Successfully retrieved list of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
              example:
                - id: anna
                  name: Anna
                  initials: A
                  reliability: 95
                  group_id: g1
                  group_name: Study Group Alpha
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch members
    post:
      tags:
        - Members
      summary: Create a new member
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
                - initials
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 10
                  example: dan
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Dan
                initials:
                  type: string
                  minLength: 1
                  maxLength: 5
                  example: D
                reliability:
                  type: integer
                  example: 100
                  minimum: 0
                  maximum: 100
                group_id:
                  type: string
                  maxLength: 10
                  nullable: true
                  example: g1
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to create member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/members/{id}:
    put:
      tags:
        - Members
      summary: Update an existing member
      operationId: updateMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - initials
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                initials:
                  type: string
                  minLength: 1
                  maxLength: 5
                reliability:
                  type: integer
                  minimum: 0
                  maximum: 100
                group_id:
                  type: string
                  maxLength: 10
                  nullable: true
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to update member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Members
      summary: Delete a member
      operationId: deleteMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Member deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to delete member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/reliability-score:
    get:
      tags:
        - Members
      summary: Get reliability score for a specific user
      description: Returns the reliability score for a user, which indicates their track record of completing tasks on time
      operationId: getUserReliabilityScore
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the user
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved reliability score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliabilityScore'
              example:
                user_id: anna
                user_name: Anna
                reliability_score: 95
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: User not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch reliability score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch reliability score

  /api/tasks:
    get:
      tags:
        - Tasks
      summary: Get tasks with optional filtering
      description: Retrieves all tasks, optionally filtered by status or assignee
      operationId: getTasks
      parameters:
        - name: status
          in: query
          required: false
          description: Filter tasks by status (pending, done, late). A value that matches no task returns an empty list.
          schema:
            type: string
            enum:
              - pending
              - done
              - late
          example: pending
        - name: assignee
          in: query
          required: false
          description: Filter tasks by assignee (member ID)
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              example:
                - id: t1
                  title: Finish calculus problem set
                  assigned_to: anna
                  status: pending
                  deadline: "2026-09-12T23:59:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch tasks
    post:
      tags:
        - Tasks
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - title
                - assigned_to
                - deadline
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 10
                  example: t4
                title:
                  type: string
                  minLength: 1
                  maxLength: 150
                  example: Review lecture notes
                assigned_to:
                  type: string
                  description: Member ID this task is assigned to (must reference an existing member)
                  example: anna
                status:
                  type: string
                  enum: [pending, done, late]
                  default: pending
                  example: pending
                deadline:
                  type: string
                  format: date-time
                  example: "2026-09-20T23:59:00Z"
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to create task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tasks/{id}:
    patch:
      tags:
        - Tasks
      summary: Update fields on an existing task
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field must be provided
              minProperties: 1
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 150
                assigned_to:
                  type: string
                status:
                  type: string
                  enum: [pending, done, late]
                deadline:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to update task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to delete task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /calendar-events:
    get:
      tags:
        - Deadlines
      summary: Get deadlines and calendar events in a date range
      description: >-
        Retrieves all deadlines/calendar events between specified dates, useful for calendar and timeline views.
        Send both `from` and `to`, or neither (neither returns every deadline). Sending only one returns 400.
      operationId: getCalendarEvents
      parameters:
        - name: from
          in: query
          required: false
          description: Start of the range. Must be sent together with `to`.
          schema:
            type: string
            format: date-time
          example: "2026-09-01T00:00:00Z"
        - name: to
          in: query
          required: false
          description: End of the range. Must be sent together with `from`.
          schema:
            type: string
            format: date-time
          example: "2026-09-30T23:59:59Z"
      responses:
        '200':
          description: Successfully retrieved calendar events in the date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deadline'
        '400':
          description: Only one of from/to was sent, or a date is not valid ISO 8601
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch calendar events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/deadlines:
    get:
      tags:
        - Deadlines
      summary: Get all upcoming deadlines sorted by date
      description: Retrieves all tasks with deadlines, sorted in ascending order by deadline date
      operationId: getDeadlines
      responses:
        '200':
          description: Successfully retrieved list of deadlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deadline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch deadlines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/activity:
    get:
      tags:
        - Activity
      summary: Get activity history for a specific user
      description: >-
        Retrieves the study/work activity log for a user, showing when they studied and for how long.
      operationId: getUserActivity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved user activity history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch activity data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/activity:
    get:
      tags:
        - Activity
      summary: Get activity log for all users or filtered by member
      description: Retrieves activity logs, optionally filtered by a specific member. Useful for team-wide activity tracking and heatmaps
      operationId: getActivity
      parameters:
        - name: member
          in: query
          required: false
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
        '400':
          description: Invalid member filter parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch activity data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/flashcards:
    get:
      tags:
        - Study Materials
      summary: Get all flashcard decks
      description: Retrieves all flashcard decks with their cards
      operationId: getFlashcardDecks
      responses:
        '200':
          description: Successfully retrieved flashcard decks with cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlashcardDeck'
              example:
                - id: d1
                  title: Data Structures Basics
                  owner_id: anna
                  shared_with_group: g1
                  cards:
                    - id: f1
                      deck_id: d1
                      question: What is a hash table?
                      answer: A data structure that maps keys to values for O(1) average lookup
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch flashcard decks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/properties:
    get:
      tags:
        - Partner Integration
      summary: List properties from the upstream partner (SettleIn)
      description: >-
        Server-side proxy to SettleIn's property list. StudySync calls SettleIn with its own
        partner key and returns a normalized shape, so no partner credentials reach the browser.
      operationId: getProperties
      responses:
        '200':
          description: Normalized property list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/PartnerUnavailable'

  /api/properties/{id}/study-amenities:
    get:
      tags:
        - Partner Integration
      summary: Study amenities for a partner property
      description: >-
        Fetches SettleIn's /api/v1/properties/{id}/study-amenities and normalizes it (typed numbers
        and booleans, nested quiet_hours). The `source` field is `live` for SettleIn's real server
        and `stand-in` when SETTLEIN_URL points at a local stand-in server.
      operationId: getPropertyStudyAmenities
      parameters:
        - name: id
          in: path
          required: true
          description: SettleIn property ID
          schema:
            type: string
          example: prop-003
      responses:
        '200':
          description: Normalized study amenities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyAmenities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Property not found at SettleIn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Property not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/PartnerUnavailable'

  /api/bookings:
    get:
      tags:
        - Study Bookings
      summary: List study-spot bookings
      operationId: getBookings
      parameters:
        - name: memberId
          in: query
          required: false
          description: Only bookings made by this member
          schema:
            type: string
          example: anna
        - name: propertyId
          in: query
          required: false
          description: Only bookings for this property
          schema:
            type: string
          example: prop-003
        - name: status
          in: query
          required: false
          description: Defaults to confirmed
          schema:
            type: string
            enum:
              - confirmed
              - cancelled
              - all
            default: confirmed
      responses:
        '200':
          description: Bookings, ordered by date and start time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid status filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to fetch bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Study Bookings
      summary: Book a study session at a partner property
      description: >-
        Validates the request against SettleIn's study-amenities for the property: the guest count
        must not exceed max_study_guests, and the session must not overlap quiet hours when the
        policy is enforced. Returns 502 if SettleIn cannot be reached, because the property cannot
        be verified. Bookings are stored by StudySync; SettleIn is not notified.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - property_id
                - booked_by
                - session_date
                - start_time
                - end_time
              properties:
                property_id:
                  type: string
                  maxLength: 40
                  example: prop-003
                booked_by:
                  type: string
                  maxLength: 10
                  description: ID of an existing member
                  example: anna
                session_date:
                  type: string
                  format: date
                  description: Today or later
                  example: "2026-11-10"
                start_time:
                  type: string
                  description: 24-hour HH:MM
                  example: "14:00"
                end_time:
                  type: string
                  description: 24-hour HH:MM, after start_time
                  example: "17:00"
                guests:
                  type: integer
                  minimum: 1
                  default: 1
                  example: 2
                note:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid or missing fields, unknown member, guest limit exceeded, or session overlaps quiet hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Session overlaps this property's quiet hours (22:00 to 06:00)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Property not found at SettleIn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: That time slot is already booked for this property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: That time slot is already booked for this property
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to create booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/PartnerUnavailable'

  /api/bookings/{id}:
    delete:
      tags:
        - Study Bookings
      summary: Cancel a booking
      description: Marks the booking as cancelled; the record is kept.
      operationId: cancelBooking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: b3f9a1c2
                  status:
                    type: string
                    example: cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error - unable to cancel booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Unauthorized:
      description: Unauthorized - Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Missing or invalid API key
            message: Missing or invalid API key
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded (100 requests per minute per API key)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  retryAfter:
                    type: integer
                    description: Seconds to wait before retrying (same value as the Retry-After header)
          example:
            error: Too many requests
            message: Too many requests
            retryAfter: 60
    PartnerUnavailable:
      description: Bad Gateway - the upstream partner (SettleIn) is unreachable or returned unusable data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Partner data unavailable
  schemas:
    Member:
      type: object
      description: A team member with reliability tracking
      required:
        - id
        - name
        - initials
        - reliability
      properties:
        id:
          type: string
          maxLength: 10
          example: anna
        name:
          type: string
          maxLength: 100
          example: Anna
        initials:
          type: string
          example: A
          minLength: 1
          maxLength: 5
        reliability:
          type: integer
          example: 95
          minimum: 0
          maximum: 100
        group_id:
          type: string
          example: g1
          nullable: true
        group_name:
          type: string
          example: Study Group Alpha
          nullable: true

    ReliabilityScore:
      type: object
      required:
        - user_id
        - user_name
        - reliability_score
      properties:
        user_id:
          type: string
          example: anna
        user_name:
          type: string
          example: Anna
        reliability_score:
          type: integer
          example: 95
          minimum: 0
          maximum: 100

    Task:
      type: object
      description: A task or to-do item assigned to a team member
      required:
        - id
        - title
        - assigned_to
        - status
        - deadline
      properties:
        id:
          type: string
          maxLength: 10
          example: t1
        title:
          type: string
          maxLength: 150
          example: Finish calculus problem set
        assigned_to:
          type: string
          example: anna
        status:
          type: string
          enum:
            - pending
            - done
            - late
          example: pending
        deadline:
          type: string
          format: date-time
          example: "2026-09-12T23:59:00Z"

    Deadline:
      type: object
      required:
        - id
        - title
        - assigned_to
        - status
        - deadline
      properties:
        id:
          type: string
          maxLength: 10
          example: t1
        title:
          type: string
          maxLength: 150
          example: Finish calculus problem set
        assigned_to:
          type: string
          example: anna
        status:
          type: string
          enum:
            - pending
