    Flashcard:
      type: object
      required:
        - id
        - deck_id
        - question
        - answer
      properties:
        id:
          type: string
          example: f1
        deck_id:
          type: string
          example: d1
        question:
          type: string
          example: What is a hash table?
        answer:
          type: string
          example: A data structure that maps keys to values for O(1) average lookup

    FlashcardDeck:
      type: object
      required:
        - id
        - title
        - owner_id
        - cards
      properties:
        id:
          type: string
          example: d1
        title:
          type: string
          example: Data Structures Basics
        owner_id:
          type: string
          example: anna
        shared_with_group:
          type: string
          description: >-
            ID of the group this deck is shared with, derived from the owner's group_id
            when the deck's shared flag is set; null if the deck is not shared. The
            database stores only a boolean flag (shared_with_group TINYINT(1)) — this
            field is computed at query time from the owner's own group_id, per the
            Week 5 CONTRACT_DEVIATIONS.md decision.
          example: g1
          nullable: true
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Flashcard'

    Property:
      type: object
      description: A property listed by the upstream partner (SettleIn), normalized by StudySync
      properties:
        id:
          type: string
          nullable: true
          example: prop-003
        title:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        location:
          type: string
          nullable: true
        campus:
          type: string
          nullable: true
        verified:
          type: boolean
        vacant_units:
          type: integer
          nullable: true
        image:
          type: string
          nullable: true

    StudyAmenities:
      type: object
      description: Normalized study amenities for a partner property
      required:
        - property_id
        - has_dedicated_desk
        - has_backup_generator
        - quiet_hours
        - source
      properties:
        property_id:
          type: string
          example: prop-003
        name:
          type: string
          nullable: true
          example: Sunrise Court
        wifi_rating:
          type: number
          nullable: true
          example: 4.5
        wifi_speed_mbps:
          type: number
          nullable: true
          example: 50
        has_dedicated_desk:
          type: boolean
        has_backup_generator:
          type: boolean
        quiet_hours:
          type: object
          properties:
            starts_at:
              type: string
              nullable: true
              example: "22:00"
            ends_at:
              type: string
              nullable: true
              example: "06:00"
            policy_enforced:
              type: boolean
        max_study_guests:
          type: integer
          nullable: true
          example: 4
        last_inspected_at:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - live
            - stand-in
          description: "`stand-in` when StudySync is pointed at a local stand-in server instead of SettleIn"

    Booking:
      type: object
      description: A study session booked at a partner property
      required:
        - id
        - property_id
        - booked_by
        - session_date
        - start_time
        - end_time
        - guests
        - status
      properties:
        id:
          type: string
          example: b3f9a1c2
        property_id:
          type: string
          example: prop-003
        property_name:
          type: string
          nullable: true
          example: Sunrise Court
        booked_by:
          type: string
          example: anna
        session_date:
          type: string
          format: date
          example: "2026-11-10"
        start_time:
          type: string
          example: "14:00"
        end_time:
          type: string
          example: "17:00"
        guests:
          type: integer
          example: 2
        note:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - confirmed
            - cancelled

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Failed to fetch members
        message:
          type: string
          description: Same text as `error`. Only present on 401 and 429 responses, kept for consumers written before Week 9.
          example: Missing or invalid API key