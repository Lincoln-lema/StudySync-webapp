openapi: 3.0.0
info:
  title: StudySync API
  version: 1.1.0
  description: A collaborative study management tool API for tracking tasks, deadlines, activity, and study materials
  contact:
    name: StudySync Team
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://api.studysync.example.com
    description: Production server

tags:
  - name: Members
    description: Team member information and reliability scores
  - name: Tasks
    description: Task management and status tracking
  - name: Deadlines
    description: Deadline and calendar event management
  - name: Activity
    description: User activity history and study logs
  - name: Study Materials
    description: Flashcard decks and study materials

paths:
  /api/members:
    get:
      tags:
        - Members
      summary: Get all team members with group information
      description: Retrieves a list of all team members including their reliability scores and group assignments
      operationId: getMembers
      responses:
        '200':
          description: Successfully retrieved list of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
              example:
                - id: anna
                  name: Anna
                  initials: A
                  reliability: 95
                  group_id: g1
                  group_name: Study Group Alpha
        '500':
          description: Server error - unable to fetch members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch members
    post:
      tags:
        - Members
      summary: Create a new member
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
                - initials
              properties:
                id:
                  type: string
                  example: dan
                name:
                  type: string
                  example: Dan
                initials:
                  type: string
                  example: D
                reliability:
                  type: integer
                  example: 100
                  minimum: 0
                  maximum: 100
                group_id:
                  type: string
                  nullable: true
                  example: g1
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to create member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/members/{id}:
    put:
      tags:
        - Members
      summary: Update an existing member
      operationId: updateMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - initials
              properties:
                name:
                  type: string
                initials:
                  type: string
                reliability:
                  type: integer
                  minimum: 0
                  maximum: 100
                group_id:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to update member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Members
      summary: Delete a member
      operationId: deleteMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Member deleted
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to delete member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/reliability-score:
    get:
      tags:
        - Members
      summary: Get reliability score for a specific user
      description: Returns the reliability score for a user, which indicates their track record of completing tasks on time
      operationId: getUserReliabilityScore
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the user
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved reliability score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliabilityScore'
              example:
                user_id: anna
                user_name: Anna
                reliability_score: 95
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: User not found
        '500':
          description: Server error - unable to fetch reliability score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch reliability score

  /api/tasks:
    get:
      tags:
        - Tasks
      summary: Get tasks with optional filtering
      description: Retrieves all tasks, optionally filtered by status, group, or assignee
      operationId: getTasks
      parameters:
        - name: status
          in: query
          required: false
          description: Filter tasks by status (pending, done, late)
          schema:
            type: string
            enum:
              - pending
              - done
              - late
          example: pending
        - name: groupId
          in: query
          required: false
          description: Filter tasks by group ID
          schema:
            type: string
          example: g1
        - name: assignee
          in: query
          required: false
          description: Filter tasks by assignee (member ID)
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              example:
                - id: t1
                  title: Finish calculus problem set
                  assigned_to: anna
                  status: pending
                  deadline: "2026-09-12T23:59:00Z"
        '400':
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid status value. Must be pending, done, or late
        '500':
          description: Server error - unable to fetch tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch tasks
    post:
      tags:
        - Tasks
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - title
                - assigned_to
                - deadline
              properties:
                id:
                  type: string
                  example: t4
                title:
                  type: string
                  example: Review lecture notes
                assigned_to:
                  type: string
                  description: Member ID this task is assigned to (must reference an existing member)
                  example: anna
                status:
                  type: string
                  enum: [pending, done, late]
                  default: pending
                  example: pending
                deadline:
                  type: string
                  format: date-time
                  example: "2026-09-20T23:59:00Z"
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to create task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tasks/{id}:
    patch:
      tags:
        - Tasks
      summary: Update fields on an existing task
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field must be provided
              properties:
                title:
                  type: string
                assigned_to:
                  type: string
                status:
                  type: string
                  enum: [pending, done, late]
                deadline:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to update task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to delete task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /calendar-events:
    get:
      tags:
        - Deadlines
      summary: Get deadlines and calendar events in a date range
      description: >-
        Retrieves all deadlines/calendar events between specified dates, useful for calendar and timeline views.
        NOTE: not yet implemented on the server as of Week 6 — documented for planned future work.
      operationId: getCalendarEvents
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-09-01T00:00:00Z"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-09-30T23:59:59Z"
      responses:
        '200':
          description: Successfully retrieved calendar events in the date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deadline'
        '400':
          description: Invalid date range parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to fetch calendar events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/deadlines:
    get:
      tags:
        - Deadlines
      summary: Get all upcoming deadlines sorted by date
      description: Retrieves all tasks with deadlines, sorted in ascending order by deadline date
      operationId: getDeadlines
      responses:
        '200':
          description: Successfully retrieved list of deadlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deadline'
        '500':
          description: Server error - unable to fetch deadlines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/activity:
    get:
      tags:
        - Activity
      summary: Get activity history for a specific user
      description: >-
        Retrieves the study/work activity log for a user, showing when they studied and for how long.
        NOTE: not yet implemented on the server as of Week 6 — documented for planned future work.
      operationId: getUserActivity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved user activity history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to fetch activity data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/activity:
    get:
      tags:
        - Activity
      summary: Get activity log for all users or filtered by member
      description: Retrieves activity logs, optionally filtered by a specific member. Useful for team-wide activity tracking and heatmaps
      operationId: getActivity
      parameters:
        - name: member
          in: query
          required: false
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Successfully retrieved activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
        '400':
          description: Invalid member filter parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to fetch activity data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/flashcards:
    get:
      tags:
        - Study Materials
      summary: Get all flashcard decks, optionally filtered by group
      description: Retrieves all flashcard decks with their cards, optionally filtered to a specific group
      operationId: getFlashcardDecks
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: string
          example: g1
      responses:
        '200':
          description: Successfully retrieved flashcard decks with cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlashcardDeck'
              example:
                - id: d1
                  title: Data Structures Basics
                  owner_id: anna
                  shared_with_group: g1
                  cards:
                    - id: f1
                      deck_id: d1
                      question: What is a hash table?
                      answer: A data structure that maps keys to values for O(1) average lookup
        '400':
          description: Invalid group ID parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error - unable to fetch flashcard decks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Member:
      type: object
      description: A team member with reliability tracking
      required:
        - id
        - name
        - initials
        - reliability
      properties:
        id:
          type: string
          example: anna
        name:
          type: string
          example: Anna
        initials:
          type: string
          example: A
          minLength: 1
          maxLength: 5
        reliability:
          type: integer
          example: 95
          minimum: 0
          maximum: 100
        group_id:
          type: string
          example: g1
          nullable: true
        group_name:
          type: string
          example: Study Group Alpha
          nullable: true

    ReliabilityScore:
      type: object
      required:
        - user_id
        - user_name
        - reliability_score
      properties:
        user_id:
          type: string
          example: anna
        user_name:
          type: string
          example: Anna
        reliability_score:
          type: integer
          example: 95
          minimum: 0
          maximum: 100

    Task:
      type: object
      description: A task or to-do item assigned to a team member
      required:
        - id
        - title
        - assigned_to
        - status
        - deadline
      properties:
        id:
          type: string
          example: t1
        title:
          type: string
          example: Finish calculus problem set
        assigned_to:
          type: string
          example: anna
        status:
          type: string
          enum:
            - pending
            - done
            - late
          example: pending
        deadline:
          type: string
          format: date-time
          example: "2026-09-12T23:59:00Z"

    Deadline:
      type: object
      required:
        - id
        - title
        - assigned_to
        - status
        - deadline
      properties:
        id:
          type: string
          example: t1
        title:
          type: string
          example: Finish calculus problem set
        assigned_to:
          type: string
          example: anna
        status:
          type: string
          enum:
            - pending
            - done
            - late
          example: pending
        deadline:
          type: string
          format: date-time
          example: "2026-09-12T23:59:00Z"

    ActivityLog:
      type: object
      required:
        - member_id
        - activity_date
        - minutes_studied
      properties:
        member_id:
          type: string
          example: anna
        activity_date:
          type: string
          format: date-time
          example: "2026-09-07T00:00:00Z"
        minutes_studied:
          type: integer
          example: 30
          minimum: 0

    Flashcard:
      type: object
      required:
        - id
        - deck_id
        - question
        - answer
      properties:
        id:
          type: string
          example: f1
        deck_id:
          type: string
          example: d1
        question:
          type: string
          example: What is a hash table?
        answer:
          type: string
          example: A data structure that maps keys to values for O(1) average lookup

    FlashcardDeck:
      type: object
      required:
        - id
        - title
        - owner_id
        - cards
      properties:
        id:
          type: string
          example: d1
        title:
          type: string
          example: Data Structures Basics
        owner_id:
          type: string
          example: anna
        shared_with_group:
          type: string
          description: >-
            ID of the group this deck is shared with, derived from the owner's group_id
            when the deck's shared flag is set; null if the deck is not shared. The
            database stores only a boolean flag (shared_with_group TINYINT(1)) — this
            field is computed at query time from the owner's own group_id, per the
            Week 5 CONTRACT_DEVIATIONS.md decision.
          example: g1
          nullable: true
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Flashcard'

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Failed to fetch members